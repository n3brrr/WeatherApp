<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Clima actual, pronóstico de seis días y próximas horas con una mirada editorial."
    />
    <meta name="theme-color" content="#EFE7DA" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <title>Weather App</title>
  </head>
  <body>
    <div class="page">
      <header id="masthead" class="masthead" aria-label="Ubicación y fecha"></header>
      <div id="status" class="status" aria-live="polite"></div>
      <main class="hero" aria-label="Clima actual">
        <section id="current" class="current" aria-label="Condiciones actuales"></section>
        <div id="hero" class="hero__art" aria-hidden="true"></div>
        <section id="daily" class="daily" aria-label="Pronóstico de seis días"></section>
      </main>
      <section id="hourly" class="hourly" aria-label="Próximas horas"></section>
      <footer id="footer" class="footer"></footer>
    </div>
    <noscript>Esta aplicación necesita JavaScript para mostrar el clima.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
